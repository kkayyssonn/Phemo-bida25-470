<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | The DEN Kitchen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Cart Sidebar -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h5><i class="bi bi-bag-fill"></i> Your Cart</h5>
        <button class="btn-close btn-close-white" onclick="closeCart()"></button>
    </div>
    <div class="cart-items" id="cartItemsList"><p class="text-muted text-center mt-4">Cart is empty</p></div>
    <div class="cart-footer">
        <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span id="cartTotalAmount">P0.00</span></div>
        <button class="btn-solid w-100 mt-2" onclick="goToCheckout()">Proceed to Checkout <i class="bi bi-arrow-right"></i></button>
        <button class="btn-outline w-100 mt-2" onclick="clearFullCart()" style="border-color:#aaa; color:#555;">Clear Cart</button>
    </div>
</div>

<nav class="main-navbar">
    <div class="logo-area"><a href="index.html"><img src="logo.png" alt="The DEN" class="logo-img" onerror="this.src='https://placehold.co/180x60/f5e6d3/b8860b?text=THE+DEN'"></a></div>
    <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="cart-icon" onclick="openCart()"><i class="bi bi-cart3"></i><span class="cart-count" id="globalCartCount">0</span></div>
        <button class="nav-toggle" id="navToggleBtn">☰</button>
    </div>
    <div class="nav-links" id="navLinks">
        <a class="nav-btn-ghost" href="index.html">Home</a>
        <a class="nav-btn-ghost" href="about.html">About</a>
        <a class="nav-btn-ghost" href="contact.html">Contact</a>
        <a class="nav-btn-ghost" href="menu.html">Menu</a>
        <a class="nav-btn-ghost" href="orderonline.html">Order Online</a>
    </div>
</nav>

<main style="flex:1">
    <div class="menu-hero">
        <div class="page-container">
            <div class="menu-hero-card">
                <h1><i class="bi bi-menu"></i> Our Menu</h1>
                <p>Freshly baked bagels, artisan breads, rolls & flatbreads made daily with love.</p>
            </div>
        </div>
    </div>
    <div class="page-container" id="menuContainer"></div>
</main>

<footer class="main-footer"><p>&copy; 2026 The DEN Kitchen - Artisan Bakery & Modern Comfort</p></footer>

<script>
    // PRODUCT DATABASE - Complete menu
    const products = [
        // Bagels
        { id: 1, name: "Plain Bagel", category: "Bagels", desc: "Classic plain bagel, perfect with cream cheese or any spread. Chewy inside, golden outside.", price: 15, ingredients: "Flour, water, yeast, salt, malt syrup" },
        { id: 2, name: "Sesame Bagel", category: "Bagels", desc: "Toasted sesame seeds bring a nutty aroma and delightful crunch to every bite.", price: 18, ingredients: "Flour, sesame seeds, water, yeast, salt" },
        { id: 3, name: "Poppy Bagel", category: "Bagels", desc: "Crunchy poppy seed coated bagel with a subtle nutty flavor.", price: 18, ingredients: "Flour, poppy seeds, water, yeast, salt" },
        { id: 4, name: "Everything Bagel", category: "Bagels", desc: "Loaded with poppy, sesame, garlic flakes & onion flakes for the ultimate savory experience.", price: 20, ingredients: "Flour, poppy seeds, sesame seeds, garlic, onion, yeast, salt" },
        { id: 5, name: "Health Mix Bagel", category: "Bagels", desc: "Seeds and grains blend including sunflower, flax, and oats for a healthy start.", price: 20, ingredients: "Flour, mixed seeds, oats, flax, yeast, salt" },
        { id: 6, name: "Blueberry Bagel", category: "Bagels", desc: "Sweet blueberry infused bagel, perfect with butter or cream cheese.", price: 20, ingredients: "Flour, dried blueberries, sugar, yeast, salt" },
        { id: 7, name: "Cinnamon Raisin Bagel", category: "Bagels", desc: "Warm cinnamon swirl with sweet plump raisins throughout.", price: 20, ingredients: "Flour, raisins, cinnamon, sugar, yeast, salt" },
        // Artisan Breads
        { id: 8, name: "Sourdough Loaf", category: "Breads", desc: "Tangy, crusty artisan loaf with perfect open crumb and complex flavor.", price: 50, ingredients: "Flour, water, sourdough starter, salt" },
        { id: 9, name: "Ciabatta", category: "Breads", desc: "Italian rustic bread with airy texture and crispy crust.", price: 50, ingredients: "Flour, water, yeast, olive oil, salt" },
        { id: 10, name: "Multigrain Bread", category: "Breads", desc: "Nutritious blend of multiple grains and seeds, high in fiber.", price: 25, ingredients: "Flour, mixed grains, seeds, yeast, salt" },
        { id: 11, name: "Challah", category: "Breads", desc: "Braided egg bread, slightly sweet and fluffy, perfect for Shabbat.", price: 50, ingredients: "Flour, eggs, sugar, yeast, oil, salt" },
        { id: 12, name: "Banana Bread", category: "Breads", desc: "Moist, sweet loaf with ripe bananas and walnuts.", price: 25, ingredients: "Flour, bananas, sugar, eggs, walnuts, baking soda" },
        { id: 13, name: "Baguette", category: "Breads", desc: "Classic French bread, crispy outside, soft and chewy inside.", price: 25, ingredients: "Flour, water, yeast, salt" },
        { id: 14, name: "Brioche Loaf", category: "Breads", desc: "Rich, buttery French bread with a soft, tender crumb.", price: 50, ingredients: "Flour, butter, eggs, sugar, yeast, salt" },
        { id: 15, name: "Light Rye", category: "Breads", desc: "Traditional rye with caraway seeds, light and flavorful.", price: 45, ingredients: "Rye flour, wheat flour, caraway seeds, yeast, salt" },
        { id: 16, name: "Dark Rye", category: "Breads", desc: "Bold, dense rye with deep, earthy flavor.", price: 50, ingredients: "Dark rye flour, caraway seeds, yeast, salt" },
        // Rolls & Buns
        { id: 17, name: "Simple Burger Bun", category: "Rolls", desc: "Classic soft burger bun, lightly sweetened.", price: 4.50, ingredients: "Flour, sugar, yeast, milk, butter, salt" },
        { id: 18, name: "Milk Burger Bun", category: "Rolls", desc: "Rich, soft milk-based bun, extra fluffy.", price: 8, ingredients: "Flour, milk powder, sugar, yeast, butter, salt" },
        { id: 19, name: "Dinner Rolls", category: "Rolls", desc: "Soft, buttery rolls perfect for any meal (6 pieces).", price: 18, ingredients: "Flour, butter, milk, eggs, yeast, salt" },
        { id: 20, name: "Garlic Knots", category: "Rolls", desc: "Twisted rolls with garlic butter & fresh herbs (4 pieces).", price: 15, ingredients: "Flour, garlic butter, parsley, yeast, salt" },
        { id: 21, name: "Cocktail Buns", category: "Rolls", desc: "Mini sweet buns perfect for parties (12 pieces).", price: 3.50, ingredients: "Flour, sugar, butter, eggs, yeast, salt" },
        // Flatbreads
        { id: 22, name: "Pita (6 pcs)", category: "Flatbreads", desc: "Soft pocket bread, perfect for stuffing with falafel or shawarma.", price: 40, ingredients: "Flour, water, yeast, olive oil, salt" },
        { id: 23, name: "Tortilla (6 pcs)", category: "Flatbreads", desc: "Soft flour tortillas for wraps, burritos, and quesadillas.", price: 40, ingredients: "Flour, water, shortening, salt, baking powder" },
        { id: 24, name: "Naan (2 pcs)", category: "Flatbreads", desc: "Traditional Indian flatbread, soft and pillowy, perfect with curry.", price: 25, ingredients: "Flour, yogurt, yeast, garlic, butter, salt" }
    ];

    let cart = JSON.parse(localStorage.getItem('denCart')) || [];

    function saveCart() { localStorage.setItem('denCart', JSON.stringify(cart)); updateCartUI(); }

    function updateCartUI() {
        const count = cart.reduce((s,i)=> s + i.qty, 0);
        document.querySelectorAll('#globalCartCount').forEach(el => { if(el) el.innerText = count; });
        const container = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotalAmount');
        if(!container) return;
        if(cart.length === 0) { container.innerHTML = '<p class="text-muted text-center mt-4">Cart is empty 🍞</p>'; if(totalSpan) totalSpan.innerText = 'P0.00'; return; }
        let html = '', total = 0;
        cart.forEach((item, idx) => { let itemTotal = item.price * item.qty; total += itemTotal;
            html += `<div class="cart-item"><div><strong>${item.name}</strong><br><small>P${item.price} each</small></div>
            <div class="cart-item-actions"><button onclick="updateQty(${idx},-1)">-</button><span class="mx-1">${item.qty}</span><button onclick="updateQty(${idx},1)">+</button>
            <button onclick="removeItem(${idx})" style="background:none; color:#999;">🗑</button></div><div>P${itemTotal.toFixed(2)}</div></div>`;
        });
        container.innerHTML = html; totalSpan.innerText = `P${total.toFixed(2)}`;
    }

    function updateQty(idx, delta) { let newQty = cart[idx].qty + delta; if(newQty <= 0) cart.splice(idx,1); else cart[idx].qty = newQty; saveCart(); }
    function removeItem(idx) { cart.splice(idx,1); saveCart(); showToast('Item removed'); }
    function clearFullCart() { if(confirm('Clear your entire cart?')) { cart = []; saveCart(); closeCart(); showToast('Cart cleared'); } }
    function addToCart(product) { 
        let existing = cart.find(i => i.id === product.id); 
        if(existing) existing.qty++; 
        else cart.push({...product, qty: 1}); 
        saveCart(); 
        showToast(`✓ ${product.name} added to cart`); 
        openCart(); 
    }
    function showToast(msg) { let t = document.createElement('div'); t.className = 'toast-msg'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
    function openCart() { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('cartOverlay').style.display = 'block'; updateCartUI(); }
    function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartOverlay').style.display = 'none'; }
    function goToCheckout() { closeCart(); window.location.href = 'orderonline.html'; }
    
    function showProductInfo(product) {
        let modalHtml = `<div class="product-modal-overlay" id="infoModal" onclick="if(event.target===this) closeModal()">
            <div class="glass-card" style="max-width:450px; background:white; margin:1rem;">
                <div class="d-flex justify-content-end"><button class="border-0 bg-transparent fs-3" onclick="closeModal()">&times;</button></div>
                <h4><i class="bi bi-info-circle"></i> ${product.name}</h4>
                <p class="text-muted">${product.desc}</p>
                <hr>
                <p><strong>Price:</strong> P${product.price.toFixed(2)}</p>
                <p><strong>Ingredients:</strong><br><small class="text-muted">${product.ingredients || "Flour, water, yeast, salt, love ❤️"}</small></p>
                <button class="btn-solid w-100 mt-3" onclick="addToCart({id:${product.id}, name:'${product.name}', price:${product.price}}); closeModal();">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }
    
    function closeModal() { let el = document.getElementById('infoModal'); if(el) el.remove(); }

    function renderMenu() {
        let categories = { Bagels: [], Breads: [], Rolls: [], Flatbreads: [] };
        products.forEach(p => { if(categories[p.category]) categories[p.category].push(p); });
        let html = '';
        for(let [cat, items] of Object.entries(categories)) {
            if(items.length) {
                html += `<div class="section-header"><i class="bi bi-bagel-fill"></i><h2>${cat}</h2><div class="section-divider"></div></div><div class="menu-grid">`;
                items.forEach(p => { 
                    html += `<div class="menu-item-card">
                        <div class="menu-item-info">
                            <h3>${p.name}</h3>
                            <p>${p.desc.substring(0, 80)}${p.desc.length > 80 ? '...' : ''}</p>
                            <span class="menu-item-price">P${p.price.toFixed(2)}</span>
                        </div>
                        <div class="action-buttons">
                            <button class="info-icon" onclick="showProductInfo(${JSON.stringify(p).replace(/"/g, '&quot;')})" title="View details"><i class="bi bi-info-lg"></i></button>
                            <button class="add-to-cart-btn" onclick="addToCart({id:${p.id}, name:'${p.name}', price:${p.price}})"><i class="bi bi-cart-plus"></i> Add</button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }
        }
        document.getElementById('menuContainer').innerHTML = html;
    }

    // Navbar toggle
    const navToggle = document.getElementById('navToggleBtn');
    const navLinks = document.getElementById('navLinks');
    if (navToggle && navLinks) {
        navToggle.addEventListener('click', function() { navLinks.classList.toggle('open'); });
    }

    renderMenu();
    updateCartUI();
    window.showProductInfo = showProductInfo;
    window.closeModal = closeModal;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.removeItem = removeItem;
    window.clearFullCart = clearFullCart;
    window.openCart = openCart;
    window.closeCart = closeCart;
    window.goToCheckout = goToCheckout;
</script>
</body>
</html>
